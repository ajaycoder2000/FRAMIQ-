<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — FarmIQ</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main id="main">
<section class="hero" style="padding-bottom:20px">
  <div class="container auth-card">
    <div class="text-center" style="margin-bottom:24px">
      <span class="eyebrow">✉️ Contact</span>
      <h1 style="font-size:2rem">Get in touch</h1>
      <p>Questions, feedback, or partnership inquiries — we read everything.</p>
    </div>

    <div class="card">
      <form id="contact-form" novalidate>
        <div class="form-field">
          <label for="c-name">Name</label>
          <input type="text" id="c-name" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="c-email">Email</label>
          <input type="email" id="c-email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="c-message">Message</label>
          <textarea id="c-message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send message</button>
        <p class="form-note text-center" id="contact-status" role="status" style="margin-top:14px"></p>
      </form>
    </div>

    <p class="text-center form-note" style="margin-top:20px">Prefer email? Reach us directly at <a href="mailto:support@farmiq.app" style="color:var(--green)">support@farmiq.app</a></p>
  </div>
</section>
</main>
<script src="assets/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('contact-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contact-status').textContent = "Thanks — this is a demo form, so nothing was sent, but in production this reaches support@farmiq.app.";
    e.target.reset();
  });
});
</script>
</body>
</html>
